services:
  connectwise-asio-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: connectwise-asio-mcp:latest
    container_name: connectwise-asio-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
      - CONNECTWISE_ASIO_BASE_URL=https://openapi.service.itsupport247.net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
